<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <style>
        body { background: #000; color: #fff; font-family: 'Arial', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .container { text-align: center; border: 1px solid #333; padding: 40px; border-radius: 10px; background: rgba(20, 20, 20, 0.8); box-shadow: 0 0 20px rgba(255, 69, 0, 0.2); }
        h1 { font-size: 3em; margin: 0; color: #ff4500; animation: glow 2s infinite alternate; }
        .status { margin: 20px 0; color: #888; }
        .btn { display: block; margin: 15px auto; padding: 15px 50px; background: transparent; border: 2px solid #ff4500; color: #ff4500; text-decoration: none; font-weight: bold; transition: 0.3s; width: 200px; }
        .btn:hover { background: #ff4500; color: #fff; }
        @keyframes glow { from { text-shadow: 0 0 5px #ff4500; } to { text-shadow: 0 0 20px #ff4500; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>PHANTOM</h1>
        <p class="status">// جاري الاتصال بالخادم...</p>
        <a href="رابط_الديسكورد_هنا" class="btn">دخول الديسكورد</a>
        <a href="#" class="btn">المزيد عن الكلان</a>
    </div>
</body>
</html>
